- aid: overjet:overjet-image-analysis-api
  name: Overjet Vision AI Image Analysis API
  tags:
  - Image Analysis
  - Radiographs
  - Computer Vision
  - DICOM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.overjet.com/blog/guide-to-dental-software-integrations
  endpointsModeled: true
  accessModel: partner-gated
  properties:
  - url: https://www.overjet.com/blog/guide-to-dental-software-integrations
    type: Documentation
  - url: https://www.overjet.com/blog/how-to-integrate-dental-ai-software-into-your-practice
    type: Documentation
  description: Modeled surface for submitting dental radiographs (bitewing, periapical,
    panoramic, CBCT) to Overjet's FDA-cleared Vision AI for analysis. In production
    this is fed by connector software and DICOM image routing from imaging systems
    rather than a public HTTP endpoint; images are routed to Overjet's cloud, analyzed
    in roughly 2-3 minutes, and results returned to the practice management or
    imaging UI. No public endpoint, base URL, or authentication scheme is documented
    - fields here are honestly modeled from Overjet's integration and imaging
    descriptions.
- aid: overjet:overjet-detections-api
  name: Overjet Detections & Findings API
  tags:
  - Detections
  - Findings
  - Caries
  - Bone Loss
  - PARL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.overjet.com/
  endpointsModeled: true
  accessModel: partner-gated
  properties:
  - url: https://www.overjet.com/
    type: Documentation
  description: Modeled surface for retrieving structured AI findings for an analyzed
    radiograph - detected and outlined caries, calculus, bone level and bone-loss
    measurements, periapical radiolucencies (PARLs), and anatomical structures, with
    per-finding confidence and pixel-level segmentation used to overlay annotations
    in the clinical UI. Represents the results consumed by partner PMS/imaging
    integrations; not a documented public endpoint.
