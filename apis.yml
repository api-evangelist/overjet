name: Overjet
kind: company
description: Overjet is a dental AI platform that applies FDA-cleared computer vision
  to dental radiographs (bitewings, periapicals, panoramics, and CBCT) to detect,
  outline, and quantify oral health conditions - caries, calculus, bone level and
  bone loss, periapical radiolucencies (PARLs), and anatomical structures - for
  dental providers, DSOs, and insurance payers. Overjet is not a self-serve public
  API. Its AI is delivered as OEM/partner integrations embedded into imaging systems
  and practice management software (Open Dental, Dentrix, Dentrix Ascend/Enterprise,
  Eaglesoft, Oryx, CareStack, and others) via connector software and DICOM image
  routing, plus payer-side products for insurance verification and claim review
  (ReviewPASS). Any programmatic access is arranged privately under a partner or
  enterprise agreement; there is no public developer portal or published API
  reference as of this catalog entry. The APIs listed below are logical,
  honestly-modeled surfaces (endpointsModeled) representing the capabilities Overjet
  exposes to integration partners, not documented public endpoints.
